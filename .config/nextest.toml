# cargo-nextest configuration for Combobulate.
#
# Scope: this file governs every `cargo nextest` invocation whose workspace
# root is this repository, including `cargo llvm-cov nextest`. It covers the
# non-doctest pass of `make test`; nextest does not run doctests, so those stay
# with the separate `cargo test --doc` pass. Packages under `tools/` declare
# their own workspace, so they read their own config, not this one.
#
# Ownership: the policy, the measured evidence, and the arithmetic behind every
# number here live in "Test timeouts" in docs/developers-guide.md. Change the
# two together.
#
# Policy: no blanket retries. A test that fails intermittently is a defect to
# diagnose, not to paper over with re-runs.

# Setup scripts are experimental in the nextest versions the coverage action may
# install, so the configuration opts in; newer versions accept the entry.
experimental = ["setup-scripts"]

[profile.default]
# Warn after 60 s and terminate after five warning periods, so a hung test ends
# at 300 s instead of holding the run open until an outer job timeout kills it.
#
# This file exists because the suite had no deadline at any layer. The incident
# that prompted it showed `SLOW [>8160.000s]` for a test nested one Cargo build
# deep: nextest's default `slow-timeout` only warns, because termination needs
# `terminate-after`, and the `trybuild` build inside the test had no timeout of
# its own. Nextest terminates the test's process group, which takes the nested
# build with it. A descendant survives only if it ignores `SIGTERM` and the test
# process itself exits on `SIGTERM`, so nextest sees no process left to
# escalate against; "Test timeouts" in the developers' guide records the gap.
#
# The green hosted gate's slowest ordinary test took 13.0 s, so 300 s is a
# sixfold margin for a test that genuinely computes rather than waits.
slow-timeout = { period = "60s", terminate-after = 5 }

# The whole run is bounded at 60 minutes (Concordat NC-004).
#
# This file used to omit a `global-timeout` on purpose. The reasoning was that a
# whole-run budget on a developer's host would diagnose local compile-queue
# contention rather than a defect, that the host is shared with other agents,
# and that the hosted `build-test` lane already has `timeout-minutes: 8`, so a
# runaway suite there is ended by the job rather than by nextest. The user's
# ruling of 16 November 2026 on the nested-cargo rules supersedes that
# reasoning: a run with tests that start nested builds carries a whole-run
# bound. No concrete failure stands against the figure. The slowest sample on
# record for a single test is 443 s under 185 queued builds, so 60 minutes is
# far from tripping on contention, and the hosted lanes are still ended first
# by their own 8-minute `timeout-minutes`.
#
# The bound is an outer limit for nextest itself, chiefly on a local
# `cargo nextest` run. It is not what ends a hung coverage lane: the pinned
# `generate-coverage` action runs Cargo under its own 1,800-second watchdog
# (`INPUT_CARGO_WAIT_TIMEOUT`), which `coverage-main.yml` does not override, so
# that watchdog stops Cargo before nextest reaches 60 minutes. The watchdog
# covers the compilation inside its own Cargo invocation, but neither bound
# covers a separate earlier workflow step such as `make prepare-ui-gate`, and a
# descendant process that outlives its parent is bounded by neither (see "Test
# timeouts" in the developers' guide).
#
# The shared `generate-coverage` action writes a temporary nextest config (180 s
# / `terminate-after` 1 / `grace-period` 5 s, plus `global-timeout = "10m"`)
# only when no config resolves, and it prefers any existing one. Landing this
# file therefore replaced that temporary file in `build-test`: the per-test
# allowance is 300 s instead of 180 s, and the whole-run cap is 60 minutes
# instead of 10. The lane's effective ceiling does not move, because the job's
# own 8-minute `timeout-minutes` is stricter than either cap, and no workspace
# member test comes close to the per-test figure.
global-timeout = "60m"

# An anchored regex, not `test(=NAME)`. Nextest's `=` form compares the whole
# test name, but a parameterized `#[rstest]` is identified by its instances,
# `name::case_1_…`, so `test(=NAME)` would match none of them and the test
# would silently keep the profile default. `^NAME($|::)` matches the plain name
# and every case suffix alike.
#
# `checked_cardinality_result_must_be_used` runs `trybuild`, which compiles a
# generated crate in a nested Cargo build. Measured: 50.3 s in the green hosted
# `build-test` run, 99.2 s and 102.2 s on an idle local host, 134.2 s in the
# hosted profile measurement, 377.2 s locally while the shared compile queue
# held 86 waiting builds, and 443.24 s locally with 185 builds queued ahead.
# Ten periods (600 s) clears the slowest contended sample by 157 s. It stays
# below the whole-run cap above and still ends a genuinely hung
# nested build long before an outer job timeout would.

[[profile.default.overrides]]
filter = 'test(/^checked_cardinality_result_must_be_used($|::)/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# Tests that start Cargo run one at a time, so their nested builds do not
# compete with each other for cores or the package-cache lock (Concordat
# NC-004). Add the binary of any new test that spawns Cargo or rustc to the
# filter below (NC-005). The three `workspace_*` and `build_toolchain_contract`
# binaries only read (`cargo tree`, `metadata` or `config`), but they share the
# package-cache lock with the builds, so they join the group too: the policy is
# "every test that starts Cargo", with no exception for read-only commands.
[test-groups]
nested-cargo = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(polars_surface_ui) | binary(native_consumer_e2e) | binary(cardinality_probe_ui) | binary(workspace_profiles) | binary(workspace_boundaries) | binary(build_toolchain_contract)'
test-group = "nested-cargo"

# Setup scripts: nested builds are prepared before the timed tests start (Concordat
# NC-010). A test that starts a nested Cargo build, or a `trybuild` crate, pays for
# a cold build inside its own termination budget unless something has filled the
# build's target directory first. On a cold `target` directory, or a host whose
# shared compile pool is queueing, the first run spends its allowance waiting for
# compile slots and is killed with no failing assertion. Each script below runs
# once before the tests it serves, under an allowance of its own, and repeats what
# those tests do (see `scripts/nextest_warm.py`), so the timed bodies find the
# work done. A script judges nothing: the tests keep every assertion, and a
# failing fixture or gate is reported by its own test. Only a missing
# prerequisite (`make prepare-ui-gate` has not run) or a timeout stops the run.
#
# One script per family, selected by binary, so a run that selects one of these
# tests warms only that family. A setup script is given no build arguments, so
# the fixture warm-up finds the test build's target directory from the
# environment (the directory `cargo llvm-cov` writes its profiles to in a
# coverage run, since it passes `--target-dir` and nests its `llvm-cov-target`
# under any `CARGO_TARGET_DIR`; else `CARGO_TARGET_DIR`; else Cargo's own
# answer); a run with an explicit `CARGO_BUILD_TARGET` moves the
# tests' directory in a way the warm-up does not model, so it builds cold. The
# allowances sum to 1,320 s, which `global-timeout` stays well above.
#
# A new test that starts a nested build needs an entry in the nested-cargo filter
# above and a warm-up here.

[scripts.setup.warm-consumer-fixtures]
command = "python3 scripts/nextest_warm.py fixtures"
slow-timeout = { period = "120s", terminate-after = 5 }

[scripts.setup.warm-cardinality-gate]
command = "python3 scripts/nextest_warm.py gate"
slow-timeout = { period = "120s", terminate-after = 5 }

[scripts.setup.warm-workspace-reads]
command = "python3 scripts/nextest_warm.py workspace"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.scripts]]
filter = 'binary(polars_surface_ui) | binary(native_consumer_e2e)'
setup = "warm-consumer-fixtures"

[[profile.default.scripts]]
filter = 'binary(cardinality_probe_ui)'
setup = "warm-cardinality-gate"

[[profile.default.scripts]]
filter = 'binary(workspace_profiles) | binary(workspace_boundaries) | binary(build_toolchain_contract)'
setup = "warm-workspace-reads"
