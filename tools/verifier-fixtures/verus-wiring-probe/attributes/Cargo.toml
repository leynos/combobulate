[package]
name = "wiring-attributes"
version = "0.1.0"
edition = "2024"
license = "ISC"
publish = false

[lib]
path = "../attributes.rs"

[lints.rust]
missing_docs = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(verus_keep_ghost)"] }

[package.metadata.verus]
verify = true

[dependencies]
# Exact pin: Verus rejects a `vstd` that does not match the pinned verifier
# build (tools/verus/VERSION), so a caret requirement cannot express it.
vstd = { version = "=0.0.0-2026-09-06-0133", default-features = false, optional = true }

[features]
verus = ["dep:vstd"]
