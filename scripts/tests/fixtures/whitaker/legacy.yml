# Relevant upstream fragments only; tests do not bind a live caller to this fixture.
# Source: leynos/shared-actions@774cc5a01e457714aede66e14a97b3e257812fc2
# Path: .github/actions/install-whitaker/action.yml; full blob 016efc76e92d86373631c9606aead1222f796b35
name: Install Whitaker
description: Install the Whitaker Dylint suite with a cached installer
inputs:
  cargo-home:
    description: Cargo home that stores the cached whitaker-installer binary
    required: false
    default: ~/.cargo
  installer-version:
    description: Version of whitaker-installer to install
    required: false
    default: 0.2.8
  installer-sha256:
    description: SHA-256 digest of the whitaker-installer release archive for this runner. The action's
      pinned digest manifest takes precedence; supply this only for an asset the manifest does not pin.
      A value that disagrees with a pinned digest is rejected.
    required: false
    default: ''
  suite-version:
    description: 'Git reference the lint suite is built from: a tag, a branch or a commit. Left empty,
      the installer builds the suite from the Whitaker default branch tip, so a change there alters lint
      results with no commit in this repository. Pinning makes a suite change arrive as a reviewed bump,
      at the cost of a source build, because prebuilt lint libraries are published only for the tip. Requires
      installer 0.2.8 or later.'
    required: false
    default: ''
  cache-provider:
    description: Cache owner for the installer binary. Use "github" for the action's built-in cache or
      "external" when the caller mounts the Cargo home.
    required: false
    default: github
  ci-mode:
    description: Treat a source build as a failure rather than a slow success. CI is meant to consume
      Whitaker's published binaries, so a run that built the lint suite or the Dylint tools from source
      has silently changed what it tested and how long it took. With this on, the action checks the published
      assets before starting, retries a short absence, and fails the step if the installer still resorted
      to a source build. Set it off only for local reproduction, where a source build is a legitimate
      choice.
    required: false
    default: 'true'
  allow-suite-pin:
    description: Permit suite-version while ci-mode is on. A pin forces a source build, because prebuilt
      lint libraries are published only for the branch tip, so the two settings contradict each other
      unless the caller says otherwise deliberately.
    required: false
    default: 'false'
  github-token:
    description: Token used only to read the public rolling release without meeting the unauthenticated
      rate limit. It is never sent anywhere else.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
  - name: Validate Whitaker inputs
    id: validate-inputs
    shell: bash
    env:
      ALLOW_SUITE_PIN_INPUT: ${{ inputs.allow-suite-pin }}
      CACHE_PROVIDER_INPUT: ${{ inputs.cache-provider }}
      CARGO_HOME_INPUT: ${{ inputs.cargo-home }}
      CI_MODE_INPUT: ${{ inputs.ci-mode }}
      INSTALLER_SHA256_INPUT: ${{ inputs.installer-sha256 }}
      INSTALLER_VERSION_INPUT: ${{ inputs.installer-version }}
      SUITE_VERSION_INPUT: ${{ inputs.suite-version }}
    run: "set -euo pipefail\ninput_error() {\n  echo \"::error title=Invalid Whitaker input::$1\" >&2\n\
      \  exit 1\n}\nif [[ -z \"${RUNNER_TEMP:-}\" ]]; then\n  input_error \"RUNNER_TEMP must name a writable\
      \ staging directory\"\nfi\nif [[ \"$CARGO_HOME_INPUT\" == *$'\\r'* || \"$CARGO_HOME_INPUT\" == *$'\\\
      n'* ]]; then\n  input_error \"cargo-home must not contain a carriage return or newline\"\nfi\nif\
      \ [[ \"$INSTALLER_VERSION_INPUT\" == *$'\\r'* || \"$INSTALLER_VERSION_INPUT\" == *$'\\n'* ]]; then\n\
      \  input_error \"installer-version must not contain a carriage return or newline\"\nfi\ncase \"\
      $CACHE_PROVIDER_INPUT\" in\n  github|external) ;;\n  *) input_error \"cache-provider must be github\
      \ or external\" ;;\nesac\ncase \"$CI_MODE_INPUT\" in\n  true|false) ;;\n  *) input_error \"ci-mode\
      \ must be true or false\" ;;\nesac\ncase \"$ALLOW_SUITE_PIN_INPUT\" in\n  true|false) ;;\n  *) input_error\
      \ \"allow-suite-pin must be true or false\" ;;\nesac\n# CI consumes Whitaker's published binaries;\
      \ it does not build them.\n# A suite pin forces a source build, because prebuilt lint libraries\n\
      # exist only for the branch tip, so the two settings contradict each\n# other. Rejected rather than\
      \ silently honoured, so a lane cannot\n# acquire a source build by setting one input.\nif [[ \"\
      $CI_MODE_INPUT\" == \"true\" && -n \"$SUITE_VERSION_INPUT\" \\\n      && \"$ALLOW_SUITE_PIN_INPUT\"\
      \ != \"true\" ]]; then\n  input_error \"suite-version forces a source build, which ci-mode forbids;\
      \ set allow-suite-pin: true to accept that cost deliberately\"\nfi\nif (( ${#CARGO_HOME_INPUT} >\
      \ 240 )); then\n  input_error \"cargo-home must be at most 240 characters\"\nfi\nif (( ${#INSTALLER_VERSION_INPUT}\
      \ > 128 )); then\n  input_error \"installer-version must be at most 128 characters\"\nfi\nif [[\
      \ ! \"$INSTALLER_VERSION_INPUT\" =~ ^(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*)){0,2}$ ]]; then\n  input_error\
      \ \"installer-version must be one to three numeric components without leading zeros\"\nfi\ninstaller_sha256=\n\
      if [[ -n \"$INSTALLER_SHA256_INPUT\" ]]; then\n  if [[ ! \"$INSTALLER_SHA256_INPUT\" =~ ^[0-9a-fA-F]{64}$\
      \ ]]; then\n    input_error \"installer-sha256 must be 64 hexadecimal characters\"\n  fi\n  installer_sha256=\"\
      $(printf '%s' \"$INSTALLER_SHA256_INPUT\" | tr 'A-F' 'a-f')\"\nfi\nif [[ \"$CARGO_HOME_INPUT\" ==\
      \ \"~\" || \"$CARGO_HOME_INPUT\" == \"~/\"* ]]; then\n  cargo_home=\"${HOME}${CARGO_HOME_INPUT:1}\"\
      \nelif [[ \"$CARGO_HOME_INPUT\" == /* ]]; then\n  cargo_home=\"$CARGO_HOME_INPUT\"\nelse\n  input_error\
      \ \"cargo-home must be an absolute path or start with ~/\"\nfi\nif [[ \"/${cargo_home}/\" == *\"\
      /../\"* ]]; then\n  input_error \"cargo-home must not contain parent-directory components\"\nfi\n\
      path_separator=:\nif [[ \"${RUNNER_OS:-}\" == Windows ]]; then\n  path_separator=';'\nfi\nif [[\
      \ \"$cargo_home\" == *\"$path_separator\"* ]]; then\n  input_error \"cargo-home must not contain\
      \ the runner PATH separator\"\nfi\nmkdir -p -- \"$cargo_home\"\ncargo_home=\"$(cd -- \"$cargo_home\"\
      \ && pwd -P)\"\nif [[ \"$cargo_home\" == *\"$path_separator\"* ]]; then\n  input_error \"cargo-home\
      \ must not contain the runner PATH separator\"\nfi\nprintf 'cargo-home=%s\\n' \"$cargo_home\" >>\
      \ \"$GITHUB_OUTPUT\"\ninstaller_suffix=\nif [[ \"${RUNNER_OS:-}\" == Windows ]]; then\n  installer_suffix=.exe\n\
      fi\nprintf 'installer-path=%s\\n' \"${cargo_home}/bin/whitaker-installer${installer_suffix}\" >>\
      \ \"$GITHUB_OUTPUT\"\nprintf 'installer-version-path=%s\\n' \"${cargo_home}/bin/.whitaker-installer-version\"\
      \ >> \"$GITHUB_OUTPUT\"\nprintf 'installer-version=%s\\n' \"$INSTALLER_VERSION_INPUT\" >> \"$GITHUB_OUTPUT\"\
      \nprintf 'installer-sha256=%s\\n' \"$installer_sha256\" >> \"$GITHUB_OUTPUT\"\n"
  - name: Run Whitaker installer
    shell: bash
    env:
      WHITAKER_INSTALLER_PATH: ${{ steps.validate-inputs.outputs.installer-path }}
      WHITAKER_INSTALLER_VERSION: ${{ steps.validate-inputs.outputs.installer-version }}
      WHITAKER_SUITE_VERSION: ${{ inputs.suite-version }}
      WHITAKER_CI_MODE: ${{ inputs.ci-mode }}
      WHITAKER_ALLOW_SUITE_PIN: ${{ inputs.allow-suite-pin }}
    run: "set -Eeuo pipefail\nemit_metric() {\n  if [[ -n \"${GITHUB_STEP_SUMMARY:-}\" ]]; then\n    printf\
      \ '%s\\n' \"$1\" >> \"$GITHUB_STEP_SUMMARY\"\n  fi\n}\ntrap 'status=$?; echo \"::error title=Whitaker\
      \ installer failed::exit-code=${status} version=${WHITAKER_INSTALLER_VERSION}\" >&2; emit_metric\
      \ \"whitaker-installer.failure=execution\"; exit \"${status}\"' ERR\n# Only stdout is captured.\
      \ Merging stderr into it would cost the\n# stream distinction the failure notices rely on, and the\
      \ installer\n# reports its source fallback on stdout. `pipefail` is already set, so\n# the installer's\
      \ exit status survives the pipe.\ninstaller_log=\"${RUNNER_TEMP:-/tmp}/whitaker-installer-output.log\"\
      \n: > \"$installer_log\"\nif [[ ! -x \"$WHITAKER_INSTALLER_PATH\" ]]; then\n  echo \"::error title=Whitaker\
      \ installer failed::installer was not created at ${WHITAKER_INSTALLER_PATH}\" >&2\n  exit 1\nfi\n\
      # Two calls rather than one with an options array: macOS runners ship\n# bash 3.2, where expanding\
      \ an empty array under `set -u` is an\n# unbound-variable error.\nif [[ -n \"${WHITAKER_SUITE_VERSION}\"\
      \ ]]; then\n  # A branch or tag can move without the caller changing anything, so\n  # reporting\
      \ it as simply \"pinned\" would claim a protection the lane\n  # does not have. Only a full commit\
      \ identifier is immutable.\n  commit_pattern='^[0-9a-fA-F]{40}$'\n  if [[ \"$WHITAKER_SUITE_VERSION\"\
      \ =~ $commit_pattern ]]; then\n    emit_metric \"whitaker-installer.suite=pinned-commit\"\n  else\n\
      \    emit_metric \"whitaker-installer.suite=pinned-mutable-ref\"\n  fi\n  \"$WHITAKER_INSTALLER_PATH\"\
      \ --suite-version \"$WHITAKER_SUITE_VERSION\" | tee \"$installer_log\"\nelse\n  # Recorded rather\
      \ than left silent: an unpinned suite is the\n  # exposure this input exists to close, and a lane\
      \ that never\n  # noticed it should be able to see it in the series.\n  emit_metric \"whitaker-installer.suite=default-branch-tip\"\
      \n  \"$WHITAKER_INSTALLER_PATH\" | tee \"$installer_log\"\nfi\n# Read from the installer's own output\
      \ rather than inferred from a\n# green exit. A source build succeeds; that is the problem. Until\
      \ the\n# installer reports the path explicitly, its fallback notice is the\n# only evidence, and\
      \ matching it is better than assuming a run that\n# passed used the binaries it was supposed to.\n\
      suite_source=prebuilt\nif grep -Eqi \"falling back|from source with cargo install|installing .*\
      \ from source\" \"$installer_log\"; then\n  suite_source=source\nfi\nemit_metric \"whitaker-installer.suite-source=${suite_source}\"\
      \n# A pin builds from source by definition, so a caller who accepted that\n# cost with allow-suite-pin\
      \ must not then be failed for the outcome\n# they asked for. Without this the escape hatch passes\
      \ validation and\n# fails the run, which is worse than not offering it.\npin_allows_source=false\n\
      if [[ -n \"${WHITAKER_SUITE_VERSION}\" && \"$WHITAKER_ALLOW_SUITE_PIN\" == \"true\" ]]; then\n \
      \ pin_allows_source=true\nfi\nif [[ \"$suite_source\" == \"source\" && \"$WHITAKER_CI_MODE\" ==\
      \ \"true\" \\\n      && \"$pin_allows_source\" != \"true\" ]]; then\n  echo \"::error title=Whitaker\
      \ installer::the installer built from source instead of using the published binaries; CI must consume\
      \ them. Re-run once the rolling release is complete, or set ci-mode: false if a source build is\
      \ intended\" >&2\n  exit 1\nfi\necho \"::notice title=Whitaker installer::status=complete version=${WHITAKER_INSTALLER_VERSION}\
      \ suite=${WHITAKER_SUITE_VERSION:-default-branch-tip} suite-source=${suite_source}\"\nemit_metric\
      \ \"whitaker-installer.result=success\"\n"
