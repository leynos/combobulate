name: Profile measurements

'on':
  workflow_dispatch:
  pull_request:
    types: [labeled]

# The label name is part of the group so two different measurement labels on
# one pull request queue independently instead of one waiting on the other.
concurrency:
  group: profile-measurements-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || 'manual' }}
  cancel-in-progress: false

jobs:
  measure-profile:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure-profiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        route: [rustdoc, clippy, whitaker, nextest, coverage, ui]
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUSTDOCFLAGS: '-D warnings'
      SCCACHE_RECACHE: '1'
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Begin setup measurement
        run: |
          mkdir -p profile-results
          date +%s > profile-results/setup-start
          nproc > profile-results/nproc
          free -b > profile-results/memory
          printf '%s\n' "$ImageOS" "$ImageVersion" > profile-results/image
      - uses: leynos/shared-actions/.github/actions/setup-rust@47b337e4f230b591891656534d4ffad868131740
        with:
          rustflags: ''
      - uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Install the pinned build standard
        run: make install-build-tools
      - name: Install measurement tools
        # Pin the versions recorded by the accepted measurement runs
        # (41163302274 and 41227443972). These timings feed pre-registered
        # controls, so a tool release between runs must not change them.
        run: cargo binstall --no-confirm --locked cargo-nextest@0.9.150 cargo-llvm-cov@0.9.1
      - uses: leynos/shared-actions/.github/actions/install-whitaker@6dea5677a84fec60ca51b07202570e3af12ffdb4
        with:
          # 0.2.9 ships cargo-dylint 6.0.1, whose driver build checks out
          # rust-clippy's `master`, renamed to `main` on 2026-10-28. 0.2.11
          # ships cargo-dylint 6.3.0, which no longer does. The digest is not
          # in the action's manifest, so it is passed explicitly.
          installer-version: '0.2.11'
          installer-sha256: a32a665d01c4a2eb03a87c584d57329fc72a3aac421c8c2b15bbdb19e5410236
          cranelift: 'true'
      - name: Fetch dependencies and record identities
        env:
          # `cargo llvm-cov --version` builds nothing, but the instrumented
          # route is always LLVM.
          CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
        run: |
          cargo fetch --locked --manifest-path tools/probes/polars-profile/Cargo.toml
          rustc -vV > profile-results/rustc
          cargo -V > profile-results/cargo
          cargo nextest --version > profile-results/nextest
          cargo llvm-cov --version > profile-results/llvm-cov
          printf '%s\n' "$CARGO_INCREMENTAL" "${RUSTC_WRAPPER-}" > profile-results/build-environment
          date +%s > profile-results/setup-end
      - name: Measure three cold runs
        env:
          ROUTE: ${{ matrix.route }}
        run: |
          set -euo pipefail
          export RUSTFLAGS='-D warnings -Zthreads=8 -C link-arg=-fuse-ld=mold'
          for run in 1 2 3; do
            export CARGO_TARGET_DIR="$PWD/profile-target-$run"
            export DYLINT_DRIVER_PATH="$CARGO_TARGET_DIR/whitaker-driver"
            output="$PWD/profile-results/$ROUTE-$run"
            mkdir -p "$CARGO_TARGET_DIR" "$DYLINT_DRIVER_PATH"
            case "$ROUTE" in
              rustdoc) command=(cargo doc --manifest-path tools/probes/polars-profile/Cargo.toml --no-deps) ;;
              clippy) command=(cargo clippy --manifest-path tools/probes/polars-profile/Cargo.toml --all-targets -- -D warnings) ;;
              whitaker) command=(env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS DYLINT_RUSTFLAGS="-D warnings" whitaker --lib whitaker_suite --fail-on-no-libraries -- --manifest-path tools/probes/polars-profile/Cargo.toml --all-targets) ;;
              nextest) command=(cargo nextest run --manifest-path tools/probes/polars-profile/Cargo.toml --lib) ;;
              ui) command=(cargo test --manifest-path tools/probes/polars-profile/Cargo.toml --test ui) ;;
              coverage)
                export CARGO_PROFILE_DEV_CODEGEN_BACKEND=llvm
                export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang
                export RUSTFLAGS='-D warnings -C link-arg=-fuse-ld=lld'
                command=(cargo llvm-cov nextest --manifest-path tools/probes/polars-profile/Cargo.toml --lib --no-report) ;;
            esac
            printf '%q ' "${command[@]}" > "$output.command"
            /usr/bin/time -v -o "$output.time" "${command[@]}" 2>&1 | tee "$output.log"
            du -sb "$CARGO_TARGET_DIR" > "$output.target-bytes"
            cat /sys/fs/cgroup/memory.peak > "$output.cgroup-memory-peak" || true
            if [ "$ROUTE" = rustdoc ]; then
              /usr/bin/time -v -o "$output.clippy-after-rustdoc.time" \
                cargo clippy --manifest-path tools/probes/polars-profile/Cargo.toml --all-targets -- -D warnings \
                2>&1 | tee "$output.clippy-after-rustdoc.log"
            fi
            if [ "$run" != 3 ]; then rm -rf -- "$CARGO_TARGET_DIR"; fi
          done
      - name: Begin cache-save measurement
        if: github.ref == 'refs/heads/main'
        run: date +%s > profile-results/cache-save-start
      - name: Save measured cache on main only
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: profile-target-3
          key: profile-measurement-${{ matrix.route }}-${{ github.run_id }}
      - name: Record cache-save evidence
        if: always()
        run: |
          if [ -f profile-results/cache-save-start ]; then
            date +%s > profile-results/cache-save-end
          else
            printf '%s\n' 'not measured: caches are saved only on main' > profile-results/cache-save-status
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-measurements-${{ matrix.route }}
          path: profile-results/

  # AC-04 under its EP-M4 amendment (DL-15). The control's own text is the
  # protocol: five cold and five warm builds per profile, profiles alternating
  # run by run, one discarded warm-up per phase, a fresh CARGO_TARGET_DIR for
  # each cold run, sccache off with RUSTC_WRAPPER verified unset, incremental
  # compilation disabled, one untimed `cargo fetch --locked`, and a single
  # timed invocation per step. Nothing here decides the verdict; it records the
  # evidence the acceptance record is written from.
  #
  # The profiles alternate *within one runner*, so this job is a single leg
  # rather than a matrix. Three parallel legs would each be a separate machine
  # and the interleaving the control requires — native, proof, Polars, native,
  # proof, Polars … — would never happen. The loop below is the interleaving.
  #
  # The proof profile's timed region is Kani codegen of the kernel, not
  # `cargo build`. It runs through the installed driver directly rather than
  # through the helper's `kani exec` route, because that route refuses this
  # repository's `[profile.dev] codegen-backend = "cranelift"`: it cannot prove
  # isolation of a backend it does not control, and the accepted route for the
  # repository is the direct driver (DL-24). The driver is selected by the
  # environment `kani-driver` needs — the release's bundled SDK toolchain,
  # warnings-as-errors through both rustflags spellings, LLVM for the verifier,
  # and the release's own `bin` and `toolchain/bin` ahead of `PATH`.
  build-budget:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure-profiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Begin the build-budget measurement
        run: |
          set -euo pipefail
          mkdir -p build-budget
          date +%s > build-budget/setup-start
          nproc > build-budget/nproc
          free -b > build-budget/memory
          printf '%s\n' "$ImageOS" "$ImageVersion" > build-budget/image
      - uses: leynos/shared-actions/.github/actions/setup-rust@47b337e4f230b591891656534d4ffad868131740
        with:
          rustflags: ''
          # The control measures with no sccache, and this action's default is
          # `true`, which installs the binary and exports `SCCACHE_PATH`. Left
          # at the default, the next step's assertion could only pass because
          # nothing had wired the wrapper yet — and the setup steps below, which
          # compile, would run with a cache one environment variable away.
          use-sccache: 'false'
      - uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Install the linker toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Install the pinned build standard
        run: make install-build-tools
      - name: Install the pinned Kani release
        run: make install-kani
      - name: Require the calibrated Kani release
        run: make kani-check
      - name: Install the checksum-verified Verus release
        # AC-04's frozen environment registers Verus and Z3 alongside rustc,
        # Kani, and mold, and the acceptance binding refuses a record that
        # omits any of them. Installing them here is what lets the tool-identity
        # step below report a version it actually observed rather than one
        # copied from the control.
        run: make install-verus
      - name: Resolve the installed Kani release root
        run: |
          set -euo pipefail
          # The Makefile derives the release root from the same pin, so naming it
          # here from that pin keeps the workflow's driver selection and the
          # installer's target in agreement rather than duplicating a path.
          root="$HOME/.kani/kani-$(cat tools/kani/VERSION)"
          test -x "$root/bin/kani-driver"
          printf 'KANI_HOME=%s\n' "$root" >> "$GITHUB_ENV"
          printf '%s\n' "$root" > build-budget/kani-release-root
      - name: Write the recorded Kani codegen launcher
        run: |
          set -euo pipefail
          # The proof profile runs the installed driver directly, so its
          # environment has to be spelled out for every sample. Writing it once
          # keeps each timed step a single invocation of a script whose text the
          # artefact upload preserves, rather than repeating five environment
          # assignments where one copy could drift from the others.
          launcher="$PWD/build-budget/kani-codegen"
          cat > "$launcher" <<'LAUNCHER'
          #!/usr/bin/env bash
          # Cold or incremental Kani codegen of the kernel, through the installed
          # driver. `RUSTUP_TOOLCHAIN` selects the SDK toolchain the release
          # bundles; `RUSTFLAGS` carries the repository's warnings-as-errors
          # policy, and `CARGO_ENCODED_RUSTFLAGS` carries it too because Cargo
          # prefers the encoded form when both are set: an inherited value would
          # otherwise replace the policy silently rather than being overridden
          # by it. The LLVM backend is the verifier's own and must displace the
          # Cranelift the repository selects for dev builds; and the release's
          # `toolchain/bin` and `bin` come first on `PATH` so the driver finds
          # its bundled rustc and CBMC. The version is not named here: the
          # release root comes from `tools/kani/VERSION`, so the pin has one
          # source and this file cannot drift from it.
          set -euo pipefail
          exec env \
            RUSTUP_TOOLCHAIN="$(cat "$KANI_HOME/rust-toolchain-version")" \
            RUSTFLAGS="-D warnings" \
            CARGO_ENCODED_RUSTFLAGS="-D"$'\x1f'"warnings" \
            CARGO_PROFILE_DEV_CODEGEN_BACKEND="llvm" \
            LD_LIBRARY_PATH="$KANI_HOME/toolchain/lib" \
            PATH="$KANI_HOME/toolchain/bin:$KANI_HOME/bin:$PATH" \
            "$KANI_HOME/bin/kani-driver" kani --only-codegen \
              --manifest-path crates/combobulate-kernel/Cargo.toml
          LAUNCHER
          chmod +x "$launcher"
          # Prove the launcher carries the arguments the control's workload
          # names, so a passing parse cannot hide a launcher that measures
          # something else.
          grep -qF -- '--only-codegen' "$launcher"
          grep -qF -- '--manifest-path crates/combobulate-kernel/Cargo.toml' "$launcher"
      - name: Record the tool identities
        run: |
          set -euo pipefail
          # AC-04 registers five toolchains and the acceptance binding refuses a
          # record that omits any of them, so each is observed here rather than
          # copied from the control. Every pin is read from the file that
          # already owns it — `tools/*/VERSION` for Kani, Verus, and mold, and
          # `Z3_DISTRIBUTION` for the solver — so this step cannot drift from
          # the version the build actually uses.
          rustc -vV > build-budget/rustc
          cargo -V > build-budget/cargo
          cargo kani --version > build-budget/kani

          verus_root=".verus/$(cat tools/verus/VERSION)/verus"
          test -x "$verus_root/verus"
          # `verus --version` runs the verifier, which refuses to start without
          # the Rust toolchain its release was built against. The release names
          # that toolchain in its own `version.json`, so it is installed from
          # there rather than guessed or pinned a second time here.
          verus_toolchain=$(sed -n 's/.*"toolchain": "\([^ "]*\).*/\1/p' "$verus_root/version.json")
          test -n "$verus_toolchain"
          rustup toolchain install "$verus_toolchain" --profile minimal --no-self-update
          "$verus_root/verus" --version > build-budget/verus

          # The Verus archive deliberately omits Z3; the probes take it from the
          # pinned `z3-solver` distribution instead, and the solver is reported
          # from the binary that distribution installed rather than from
          # whichever `z3` happens to be on `PATH`.
          z3_distribution=$(sed -n 's/^Z3_DISTRIBUTION = "\(.*\)"$/\1/p' scripts/probe_provenance.py)
          test -n "$z3_distribution"
          z3_path=$(uv tool run --from "$z3_distribution" python \
            -c "import shutil; print(shutil.which('z3') or '')")
          test -n "$z3_path"
          "$z3_path" --version > build-budget/z3

          mold --version > build-budget/mold
          # The dev profile's backend is Cranelift and the proof profile's is
          # LLVM; both are asserted from the files that select them, so the
          # record describes the configuration that ran.
          grep -qF 'codegen-backend = "cranelift"' .cargo/config.toml
          grep -qF 'CARGO_PROFILE_DEV_CODEGEN_BACKEND="llvm"' "$PWD/build-budget/kani-codegen"
          date +%s > build-budget/setup-end
      - name: Fetch dependencies once, untimed
        run: cargo fetch --locked
      - name: Confirm the measured environment carries no cache
        run: |
          set -euo pipefail
          # The control's cache policy is "no sccache", and every step above this
          # one provisions tools. The assertion belongs here rather than at the
          # top of the job, so it observes the environment the timed builds will
          # actually inherit: a wrapper exported by any provisioning step below
          # fails the job instead of quietly caching the samples. The recorded
          # fact goes with it, for the same reason — an environment captured
          # before the tools were installed would describe a runner that never
          # ran a build.
          test -z "${RUSTC_WRAPPER-}"
          printf '%s\n' "${RUSTC_WRAPPER-}" "$CARGO_INCREMENTAL" > build-budget/build-environment
      - name: Measure five cold builds per profile, alternating
        run: |
          set -euo pipefail
          # Each pass is one "run" in the control's sense and measures all three
          # profiles, so no profile's five samples are taken back to back.
          for run in 1 2 3 4 5; do
            for profile in native-only polars-enabled; do
              case "$profile" in
                native-only) flags=(--no-default-features) ;;
                polars-enabled) flags=() ;;
              esac
              export CARGO_TARGET_DIR="$PWD/build-budget/cold-target-$profile-$run"
              rm -rf -- "$CARGO_TARGET_DIR"
              output="$PWD/build-budget/cold-$profile-$run"
              /usr/bin/time -v -o "$output.time" \
                cargo build --workspace "${flags[@]+"${flags[@]}"}" \
                2>&1 | tee "$output.log"
              du -sb "$CARGO_TARGET_DIR" > "$output.target-bytes" || true
              # The cold target is deleted afterwards: keeping ten of them would
              # hold several gigabytes and could exhaust the runner's disk before
              # the warm phase starts.
              rm -rf -- "$CARGO_TARGET_DIR"
            done
            proof_target="$PWD/build-budget/cold-target-proof-$run"
            rm -rf -- "$proof_target"
            proof_output="$PWD/build-budget/cold-proof-$run"
            /usr/bin/time -v -o "$proof_output.time" \
              env CARGO_TARGET_DIR="$proof_target" \
                "$PWD/build-budget/kani-codegen" 2>&1 | tee "$proof_output.log"
            du -sb "$proof_target" > "$proof_output.target-bytes" || true
            rm -rf -- "$proof_target"
          done
      - name: Discard one warm-up build per profile
        run: |
          set -euo pipefail
          for profile in native-only polars-enabled; do
            case "$profile" in
              native-only) flags=(--no-default-features) ;;
              polars-enabled) flags=() ;;
            esac
            export CARGO_TARGET_DIR="$PWD/build-budget/warm-target-$profile"
            rm -rf -- "$CARGO_TARGET_DIR"
            cargo build --workspace "${flags[@]+"${flags[@]}"}"
          done
      - name: Discard one warm-up Kani codegen
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$PWD/build-budget/warm-target-proof"
          rm -rf -- "$CARGO_TARGET_DIR"
          "$PWD/build-budget/kani-codegen"
      - name: Measure five incremental builds per profile, alternating
        run: |
          set -euo pipefail
          source_file=src/lib.rs
          kernel_file=crates/combobulate-kernel/src/lib.rs
          for run in 1 2 3 4 5; do
            for profile in native-only polars-enabled; do
              case "$profile" in
                native-only) flags=(--no-default-features) ;;
                polars-enabled) flags=() ;;
              esac
              export CARGO_TARGET_DIR="$PWD/build-budget/warm-target-$profile"
              output="$PWD/build-budget/incremental-$profile-$run"
              # The control's timed region begins after the touch; touching the
              # crate root is what makes the rebuild incremental rather than a
              # no-op.
              printf '\n' >> "$source_file"
              /usr/bin/time -v -o "$output.time" \
                cargo build --workspace "${flags[@]+"${flags[@]}"}" \
                2>&1 | tee "$output.log"
              git checkout -- "$source_file"
            done
            export CARGO_TARGET_DIR="$PWD/build-budget/warm-target-proof"
            proof_output="$PWD/build-budget/incremental-proof-$run"
            printf '\n' >> "$kernel_file"
            /usr/bin/time -v -o "$proof_output.time" \
              "$PWD/build-budget/kani-codegen" 2>&1 | tee "$proof_output.log"
            git checkout -- "$kernel_file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-budget
          path: build-budget/

  verifier-free:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure-profiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Prepare an ordinary compiler without verifier installations
        run: |
          test -z "${RUSTC_WRAPPER-}"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld mold podman
      - name: Install the pinned build standard
        run: make install-build-tools
      - name: Fetch ordinary dependencies
        run: cargo fetch --locked --manifest-path tools/verifier-fixtures/verus-wiring-probe/Cargo.toml
      - name: Build inside the verifier-free rootless container
        run: uv run --script scripts/run_verifier_probes.py verifier-free
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verifier-free-observations
          path: |
            tools/verifier-fixtures/verus-wiring-probe/observations/
            tools/verifier-fixtures/verus-wiring-probe/verifier-free.json
