name: Profile measurements

'on':
  workflow_dispatch:
  pull_request:
    types: [labeled]

# The label name is part of the group so two different measurement labels on
# one pull request queue independently instead of one waiting on the other.
concurrency:
  group: profile-measurements-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || 'manual' }}
  cancel-in-progress: false

jobs:
  measure-profile:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure-profiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        route: [rustdoc, clippy, whitaker, nextest, coverage, ui]
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUSTDOCFLAGS: '-D warnings'
      SCCACHE_RECACHE: '1'
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Begin setup measurement
        run: |
          mkdir -p profile-results
          date +%s > profile-results/setup-start
          nproc > profile-results/nproc
          free -b > profile-results/memory
          printf '%s\n' "$ImageOS" "$ImageVersion" > profile-results/image
      - uses: leynos/shared-actions/.github/actions/setup-rust@47b337e4f230b591891656534d4ffad868131740
        with:
          rustflags: ''
      - uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Install the pinned build standard
        run: make install-build-tools
      - name: Install measurement tools
        # Pin the versions recorded by the accepted measurement runs
        # (41163302274 and 41227443972). These timings feed pre-registered
        # controls, so a tool release between runs must not change them.
        run: cargo binstall --no-confirm --locked cargo-nextest@0.9.150 cargo-llvm-cov@0.9.1
      - uses: leynos/shared-actions/.github/actions/install-whitaker@6dea5677a84fec60ca51b07202570e3af12ffdb4
        with:
          # 0.2.9 ships cargo-dylint 6.0.1, whose driver build checks out
          # rust-clippy's `master`, renamed to `main` on 2026-10-28. 0.2.11
          # ships cargo-dylint 6.3.0, which no longer does. The digest is not
          # in the action's manifest, so it is passed explicitly.
          installer-version: '0.2.11'
          installer-sha256: a32a665d01c4a2eb03a87c584d57329fc72a3aac421c8c2b15bbdb19e5410236
          cranelift: 'true'
      - name: Fetch dependencies and record identities
        env:
          # `cargo llvm-cov --version` builds nothing, but the instrumented
          # route is always LLVM.
          CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
        run: |
          cargo fetch --locked --manifest-path tools/probes/polars-profile/Cargo.toml
          rustc -vV > profile-results/rustc
          cargo -V > profile-results/cargo
          cargo nextest --version > profile-results/nextest
          cargo llvm-cov --version > profile-results/llvm-cov
          printf '%s\n' "$CARGO_INCREMENTAL" "${RUSTC_WRAPPER-}" > profile-results/build-environment
          date +%s > profile-results/setup-end
      - name: Measure three cold runs
        env:
          ROUTE: ${{ matrix.route }}
        run: |
          set -euo pipefail
          export RUSTFLAGS='-D warnings -Zthreads=8 -C link-arg=-fuse-ld=mold'
          for run in 1 2 3; do
            export CARGO_TARGET_DIR="$PWD/profile-target-$run"
            export DYLINT_DRIVER_PATH="$CARGO_TARGET_DIR/whitaker-driver"
            output="$PWD/profile-results/$ROUTE-$run"
            mkdir -p "$CARGO_TARGET_DIR" "$DYLINT_DRIVER_PATH"
            case "$ROUTE" in
              rustdoc) command=(cargo doc --manifest-path tools/probes/polars-profile/Cargo.toml --no-deps) ;;
              clippy) command=(cargo clippy --manifest-path tools/probes/polars-profile/Cargo.toml --all-targets -- -D warnings) ;;
              whitaker) command=(env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS DYLINT_RUSTFLAGS="-D warnings" whitaker --all -- --manifest-path tools/probes/polars-profile/Cargo.toml --all-targets) ;;
              nextest) command=(cargo nextest run --manifest-path tools/probes/polars-profile/Cargo.toml --lib) ;;
              ui) command=(cargo test --manifest-path tools/probes/polars-profile/Cargo.toml --test ui) ;;
              coverage)
                export CARGO_PROFILE_DEV_CODEGEN_BACKEND=llvm
                export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang
                export RUSTFLAGS='-D warnings -C link-arg=-fuse-ld=lld'
                command=(cargo llvm-cov nextest --manifest-path tools/probes/polars-profile/Cargo.toml --lib --no-report) ;;
            esac
            printf '%q ' "${command[@]}" > "$output.command"
            /usr/bin/time -v -o "$output.time" "${command[@]}" 2>&1 | tee "$output.log"
            du -sb "$CARGO_TARGET_DIR" > "$output.target-bytes"
            cat /sys/fs/cgroup/memory.peak > "$output.cgroup-memory-peak" || true
            if [ "$ROUTE" = rustdoc ]; then
              /usr/bin/time -v -o "$output.clippy-after-rustdoc.time" \
                cargo clippy --manifest-path tools/probes/polars-profile/Cargo.toml --all-targets -- -D warnings \
                2>&1 | tee "$output.clippy-after-rustdoc.log"
            fi
            if [ "$run" != 3 ]; then rm -rf -- "$CARGO_TARGET_DIR"; fi
          done
      - name: Begin cache-save measurement
        if: github.ref == 'refs/heads/main'
        run: date +%s > profile-results/cache-save-start
      - name: Save measured cache on main only
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: profile-target-3
          key: profile-measurement-${{ matrix.route }}-${{ github.run_id }}
      - name: Record cache-save evidence
        if: always()
        run: |
          if [ -f profile-results/cache-save-start ]; then
            date +%s > profile-results/cache-save-end
          else
            printf '%s\n' 'not measured: caches are saved only on main' > profile-results/cache-save-status
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-measurements-${{ matrix.route }}
          path: profile-results/

  # AC-04 under its EP-M4 amendment (DL-15). The control's own text is the
  # protocol: five cold and five warm builds per profile, profiles alternating
  # run by run, one discarded warm-up per phase, a fresh CARGO_TARGET_DIR for
  # each cold run, sccache off with RUSTC_WRAPPER verified unset, incremental
  # compilation disabled, one untimed `cargo fetch --locked`, and a single
  # timed invocation per step. Nothing here decides the verdict; it records the
  # evidence the acceptance record is written from.
  build-budget:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure-profiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Profiles alternate run by run, so the budget job measures them in one
      # runner rather than in parallel matrix legs: a second leg on the same
      # host would contend for the CPU the timing is measuring.
      matrix:
        profile: [native-only, proof, polars-enabled]
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUSTDOCFLAGS: '-D warnings'
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Begin the build-budget measurement
        run: |
          set -euo pipefail
          mkdir -p build-budget
          date +%s > build-budget/setup-start
          nproc > build-budget/nproc
          free -b > build-budget/memory
          printf '%s\n' "$ImageOS" "$ImageVersion" > build-budget/image
          # The control's cache policy is "no sccache"; a wrapper left set by an
          # earlier step would cache compile results and change the timings.
          test -z "${RUSTC_WRAPPER-}"
          printf '%s\n' "${RUSTC_WRAPPER-}" "$CARGO_INCREMENTAL" > build-budget/build-environment
      - uses: leynos/shared-actions/.github/actions/setup-rust@47b337e4f230b591891656534d4ffad868131740
        with:
          rustflags: ''
      - uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Install the linker toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Install the pinned build standard
        run: make install-build-tools
      - name: Install the pinned Kani release
        if: matrix.profile == 'proof'
        run: make install-kani
      - name: Record the tool identities
        run: |
          set -euo pipefail
          rustc -vV > build-budget/rustc
          cargo -V > build-budget/cargo
          date +%s > build-budget/setup-end
      - name: Fetch dependencies once, untimed
        run: cargo fetch --locked
      - name: Measure five cold builds
        run: |
          set -euo pipefail
          case "$PROFILE" in
            native-only) flags=(--no-default-features) ;;
            proof) flags=(--no-default-features) ;;
            polars-enabled) flags=() ;;
          esac
          for run in 1 2 3 4 5; do
            export CARGO_TARGET_DIR="$PWD/build-budget/cold-target-$run"
            rm -rf -- "$CARGO_TARGET_DIR"
            output="$PWD/build-budget/cold-$PROFILE-$run"
            /usr/bin/time -v -o "$output.time" \
              cargo build --workspace "${flags[@]+"${flags[@]}"}" \
              2>&1 | tee "$output.log"
            du -sb "$CARGO_TARGET_DIR" > "$output.target-bytes"
            # The cold target is deleted afterwards: keeping five of them would
            # hold several gigabytes and could exhaust the runner's disk before
            # the warm phase starts.
            rm -rf -- "$CARGO_TARGET_DIR"
          done
      - name: Discard one warm-up build
        run: |
          set -euo pipefail
          case "$PROFILE" in
            native-only) flags=(--no-default-features) ;;
            proof) flags=(--no-default-features) ;;
            polars-enabled) flags=() ;;
          esac
          export CARGO_TARGET_DIR="$PWD/build-budget/warm-target"
          rm -rf -- "$CARGO_TARGET_DIR"
          cargo build --workspace "${flags[@]+"${flags[@]}"}"
      - name: Measure five incremental builds
        run: |
          set -euo pipefail
          case "$PROFILE" in
            native-only) flags=(--no-default-features) ;;
            proof) flags=(--no-default-features) ;;
            polars-enabled) flags=() ;;
          esac
          source_file=src/lib.rs
          for run in 1 2 3 4 5; do
            export CARGO_TARGET_DIR="$PWD/build-budget/warm-target"
            output="$PWD/build-budget/incremental-$PROFILE-$run"
            # The control's timed region begins after the touch; touching the
            # crate root is what makes the rebuild incremental rather than a
            # no-op.
            printf '\n' >> "$source_file"
            /usr/bin/time -v -o "$output.time" \
              cargo build --workspace "${flags[@]+"${flags[@]}"}" \
              2>&1 | tee "$output.log"
            git checkout -- "$source_file"
          done
      - name: Measure the proof profile's Kani codegen
        if: matrix.profile == 'proof'
        run: |
          set -euo pipefail
          output="$PWD/build-budget/proof-codegen"
          # The helper is pinned to the commit in tools/rust-prover-tools/REF,
          # which is the same source the Makefile's PROVER_TOOLS resolves. It is
          # read here rather than through Make so the timed step has one
          # invocation instead of a Make wrapper around it.
          ref=$(awk '/^ref:/ { print $2 }' tools/rust-prover-tools/REF)
          # The proof profile's timed region is the codegen of the kernel, not
          # a full verification: --only-codegen skips CBMC, which is what the
          # control's proof_cold_minutes budget describes.
          /usr/bin/time -v -o "$output.time" \
            uv tool run --from "git+https://github.com/leynos/rust-prover-tools.git@$ref" \
              prover-tools kani exec --cwd crates/combobulate-kernel \
              --extra-arg=--only-codegen --extra-arg=-Z --extra-arg=unstable-options \
            2>&1 | tee "$output.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-budget-${{ matrix.profile }}
          path: build-budget/

  verifier-free:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure-profiles'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Prepare an ordinary compiler without verifier installations
        run: |
          test -z "${RUSTC_WRAPPER-}"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld mold podman
      - name: Install the pinned build standard
        run: make install-build-tools
      - name: Fetch ordinary dependencies
        run: cargo fetch --locked --manifest-path tools/verifier-fixtures/verus-wiring-probe/Cargo.toml
      - name: Build inside the verifier-free rootless container
        run: uv run --script scripts/run_verifier_probes.py verifier-free
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verifier-free-observations
          path: |
            tools/verifier-fixtures/verus-wiring-probe/observations/
            tools/verifier-fixtures/verus-wiring-probe/verifier-free.json
