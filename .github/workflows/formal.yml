name: Formal verification

# Proof code that no job runs is a comment, so this workflow runs it: the
# cardinality probe's Kani harnesses and Verus proof, the Kani log corpus whose
# harnesses mostly fail on purpose, and the four Verus wiring candidates. It
# runs on a pull request that touches what the proofs verify or how they are
# run, and weekly. The kernel's own Kani harnesses arrive with task 1.2.4 and
# join `make kani` then.
#
# The kernel's own Verus proof and its seeded mutants run here too
# (`make verus-kernel`): a proof no job runs cannot report its own rot, and
# this one decides whether the shipped `add_i64_into` still satisfies SC-12.
# It is development evidence until PF05.proof@2.3.5 admits it (DL-1).
#
# Kani and Verus are installed only through the shared install-prover-tools
# action, which reads the releases from tools/kani/VERSION and
# tools/verus/VERSION and the installer revision from nothing here: the action's
# default is the estate's rust-prover-tools revision, the one
# tools/rust-prover-tools/REF names for the local Make targets.

'on':
  pull_request:
    paths:
      - 'tools/calibration/**'
      - 'tools/verifier-fixtures/**'
      - 'tools/kani/**'
      - 'tools/verus/**'
      - 'tools/rust-prover-tools/**'
      - 'scripts/check_kani_corpus.py'
      - 'scripts/captured_command.py'
      - 'scripts/verus_probe.py'
      - 'scripts/verus_kernel.py'
      - 'scripts/verus_kernel_verdicts.py'
      - 'scripts/kernel_record.py'
      - 'scripts/tests/test_verus_kernel.py'
      - 'scripts/docs_validation/kani_log/**'
      - 'scripts/tests/fixtures/kani_logs/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - '.github/workflows/formal.yml'
  schedule:
    # Weekly, offset from the daily mutation run and the Monday design check so
    # the two do not contend for the same hosted minutes.
    - cron: '43 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

# A second push to a pull request supersedes the run already in flight; a
# scheduled or dispatched run is never replaced.
concurrency:
  group: formal-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kani:
    name: Kani
    # GitHub-hosted: the job needs no compiler cache and compute there is free.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          persist-credentials: false
      # The corpus checker is a `uv run --script` file that declares its own
      # Python and dependencies.
      - uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Install Kani
        uses: leynos/shared-actions/.github/actions/install-prover-tools@88ac795de687eda016db24983f87a25d6db49fdb
        with:
          tools: kani
          runner-image: ubuntu2404
      - name: Run the cardinality probe's Kani harnesses
        run: make kani
      - name: Check the Kani corpus against its recorded decisions
        # Most corpus harnesses fail by design (a counterexample, an
        # unsatisfied cover, a too-small unwind bound, a 5 s solver timeout), so
        # this step compares each run's decision, not its exit status.
        run: make kani-corpus

  verus:
    name: Verus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Install Verus and Z3
        id: prover
        uses: leynos/shared-actions/.github/actions/install-prover-tools@88ac795de687eda016db24983f87a25d6db49fdb
        with:
          tools: verus
          runner-image: ubuntu2404
      - name: Run the Verus proofs and wiring candidates
        env:
          VERUS_Z3_PATH: ${{ steps.prover.outputs.z3-path }}
        run: make verus
      - name: Verify the kernel proof and reject its mutants
        # The step order matters: this needs the pinned installation the
        # previous step proves still works.
        #
        # `pipefail` is explicit because the default shell is `bash -e`, which
        # reports only `tee`'s status: without it a failed proof would leave a
        # green step and a log nobody reads.
        env:
          VERUS_Z3_PATH: ${{ steps.prover.outputs.z3-path }}
        run: |
          set -o pipefail
          mkdir -p formal-results
          make verus-kernel 2>&1 | tee formal-results/verus-kernel.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # `always()` so a failed proof still leaves the log naming the clause or
        # mutant that failed.
        if: always()
        with:
          name: verus-kernel-log
          path: formal-results/verus-kernel.log
          if-no-files-found: warn
