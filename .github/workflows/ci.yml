
name: CI

# DL-03: `build-test` keeps the native-only profile, and the Polars-enabled
# profile is linted and tested in two parallel jobs. AC-07's amended workload
# (DL-14) is every required pull-request job here, so all three jobs share the
# registered runner image and timeout, and each is sized so its slowest cold
# run stays inside six minutes.
#
# DL-03's cache clause is only satisfied when Rust compilation actually goes
# through sccache, so every job sets `RUSTC_WRAPPER: sccache` and
# `SCCACHE_GHA_ENABLED: "true"`. The pinned `setup-rust` action runs
# `mozilla-actions/sccache-action`, which installs the binary and exports
# `SCCACHE_PATH` but never sets either variable; a job that left them unset
# compiled without the cache and reported `Compile requests 0` with no error of
# its own. The value is a bare command name on `PATH` so the action's install
# location is what resolves it; a value Cargo cannot execute is a hard build
# failure, not a silent fallback.

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    # Pre-registered budget AC-07 (spec/acceptance-controls.json): any failed
    # attempt fails independently of p90 over the latest 20 attempts.
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # Make routes read this to select one profile. The native-only profile is
      # the one AC-07 measures, and the two *-polars jobs own the other.
      GATE_PROFILE: native-only
      # DL-03: route every rustc invocation through the cache sccache-action
      # installed. Nothing supplies this variable on the job's behalf, so
      # declaring it here is what makes the cache reachable at all.
      RUSTC_WRAPPER: sccache
      # The GitHub Actions cache backend, which is the sccache storage DL-03
      # names. Without it sccache compiles through to disk and shares nothing
      # between jobs or runs.
      SCCACHE_GHA_ENABLED: "true"
      # DL-03 permits cache saves only on `main`, and sccache defaults to
      # writing. This key is the only lever that separates the two: the pull
      # request lane reads `main`'s cache and adds nothing back. A run that
      # saved here would fill `refs/pull/<n>/merge`, a ref nothing reads again
      # once it advances, which is how 1.02 GB accumulated against a 154 MB
      # `main` cache.
      #
      # The test is the ref, not the event, because `workflow_dispatch` is
      # also declared here and a dispatch may run from any branch. A dispatch
      # reports its event name as `workflow_dispatch`, so `event_name ==
      # 'push'` is false for it and makes every dispatch `READ_ONLY`, main
      # included. The ref gives the permitted write to `main` alone and reads
      # everywhere else.
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@47b337e4f230b591891656534d4ffad868131740
        with:
          # An empty input leaves Cargo's configured development flags active.
          # Make gates still assign their own warning and build-standard flags.
          rustflags: ''
          # DL-03 requires sccache in every hosted job. The action's default is
          # already `true`, so naming it pins the dependency on that default
          # rather than changing behaviour.
          use-sccache: 'true'
      - name: Log Rust compiler configuration
        run: |-
          rustc --version
          printf 'Base RUSTFLAGS: %s\n' "$RUSTFLAGS"
      - name: Install linker prerequisites
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Report sccache wiring
        # DL-03's cache clause is about compilation that actually reaches
        # sccache, and nothing here errors if the variable is simply absent. So
        # this step resolves the configured wrapper on PATH and prints the
        # cache's own statistics, whose cache-location line names
        # the backend the server is actually using. That is the observable
        # evidence that builds from here on are wrapped. It runs before the
        # suite routes so a later failure cannot leave the question unanswered,
        # and `--show-stats` needs no compile to answer it.
        run: |
          set -euo pipefail
          wrapper="${RUSTC_WRAPPER:?DL-03 requires a compiler wrapper}"
          command -v "$wrapper"
          sccache --show-stats
      - name: Install the build standard
        # The pinned toolchain and mold must precede every local suite route.
        run: make install-build-tools
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: >-
          leynos/shared-actions/.github/actions/install-mdtablefix@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
        with:
          version: '0.6.1'
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@2df9e28eb87988518ef3880c34edad45d65b1668
        with:
          globs: '**/*.md'
      - name: Setup uv
        uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Check spelling
        run: make spelling
      - name: Install test runner
        env:
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm --locked cargo-nextest
      # Dependency audits report advisories against the whole lockfile, so a
      # newly published advisory would fail every Dependabot PR regardless of
      # content and deadlock auto-merge. The scheduled audit workflow covers
      # Dependabot merges instead.
      - name: Install cargo-audit
        if: github.actor != 'dependabot[bot]'
        env:
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm cargo-audit
      - name: Setup Python for audit manifest extraction
        if: github.actor != 'dependabot[bot]'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.x'
      - name: Verify Whitaker capability
        timeout-minutes: 3
        run: >-
          uv run --with PyYAML==6.0.3 python scripts/whitaker_probe.py
          --workflow .github/workflows/ci.yml
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@5a99aed78ce68dcebd3052b75c31e6f173162b1e # shared-actions 5a99aed7 (whitaker-installer 0.2.11)
        with:
          cranelift: 'true'
      - name: Audit dependencies
        if: github.actor != 'dependabot[bot]'
        run: make audit
      - name: Lint
        # A private path exercises Dylint's cold driver construction on each
        # hosted run before the repository lint check.
        env:
          DYLINT_DRIVER_PATH: ${{ runner.temp }}/combobulate-whitaker-driver
        run: |
          mkdir -p "$DYLINT_DRIVER_PATH"
          make lint
      - name: Log coverage linker configuration
        run: |
          echo "Coverage linker: clang"
          echo "Coverage RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld"
          echo "Coverage CFLAGS: -fuse-ld=lld"
          echo "Coverage LDFLAGS: -fuse-ld=lld"
      - name: Test and Measure Coverage
        if: env.ACT != 'true'
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        env:
          CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          # The publisher in coverage-main.yml owns the coverage artefact and
          # the ratchet baseline; this lane only compares against it.
          publish-artefact: 'false'
          # DL-03/DL-18: coverage measures the native-only profile, which is
          # also the profile this job lints and tests. Naming it explicitly
          # keeps this measurement equal to the baseline coverage-main.yml
          # advances.
          with-default-features: 'false'
          features: ''
      - name: Test under Act
        # Hosted coverage is skipped under Act, so execute the ordinary suite.
        if: env.ACT == 'true'
        env:
          WITH_ACT: '0'
        run: make test

  # DL-03 shape B: the Polars-enabled profile is linted here rather than in
  # `build-test`, so a cold Polars build cannot consume the native-only job's
  # budget. The route is `build-test`'s provisioning prelude without the steps
  # that exist to produce the native-only measured coverage artefact.
  polars-lint:
    runs-on: ubuntu-24.04
    # AC-07 (DL-14) measures every required job, so this one carries the same
    # registered budget as `build-test`.
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      GATE_PROFILE: polars-enabled
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # DL-03 permits cache saves only on `main`; see `build-test` for the ref test.
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@47b337e4f230b591891656534d4ffad868131740
        with:
          # An empty input leaves Cargo's configured development flags active.
          rustflags: ''
          # DL-03 requires sccache in every hosted job; the action's default is
          # already `true`, so this pins the dependency rather than changing it.
          use-sccache: 'true'
      - name: Log Rust compiler configuration
        run: |-
          rustc --version
          printf 'Base RUSTFLAGS: %s\n' "$RUSTFLAGS"
      - name: Install linker prerequisites
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Report sccache wiring
        # See `build-test`: the action installs sccache but sets no wrapper, so
        # this step is the evidence that the job's compilation is wrapped.
        run: |
          set -euo pipefail
          wrapper="${RUSTC_WRAPPER:?DL-03 requires a compiler wrapper}"
          command -v "$wrapper"
          sccache --show-stats
      - name: Install the build standard
        # The pinned toolchain and mold must precede every local suite route.
        run: make install-build-tools
      - name: Setup uv
        uses: astral-sh/setup-uv@12d13f90bc3a5a1971bebad4beb09a4dfa962e91
      - name: Verify Whitaker capability
        timeout-minutes: 3
        run: >-
          uv run --with PyYAML==6.0.3 python scripts/whitaker_probe.py
          --workflow .github/workflows/ci.yml
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@5a99aed78ce68dcebd3052b75c31e6f173162b1e # shared-actions 5a99aed7 (whitaker-installer 0.2.11)
        with:
          cranelift: 'true'
      - name: Lint
        # A private path exercises Dylint's cold driver construction on each
        # hosted run before the repository lint check.
        env:
          DYLINT_DRIVER_PATH: ${{ runner.temp }}/combobulate-whitaker-driver
        run: |
          mkdir -p "$DYLINT_DRIVER_PATH"
          make lint

  # The Polars-enabled profile's test route. `make test` is the same entry
  # point `build-test` uses under Act, so profile selection is the only
  # difference; measured coverage stays a native-only artefact.
  polars-test:
    runs-on: ubuntu-24.04
    # AC-07 (DL-14) measures every required job, so this one carries the same
    # registered budget as `build-test`.
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      GATE_PROFILE: polars-enabled
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # DL-03 permits cache saves only on `main`; see `build-test` for the ref test.
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@47b337e4f230b591891656534d4ffad868131740
        with:
          # An empty input leaves Cargo's configured development flags active.
          rustflags: ''
          # DL-03 requires sccache in every hosted job; the action's default is
          # already `true`, so this pins the dependency rather than changing it.
          use-sccache: 'true'
      - name: Log Rust compiler configuration
        run: |-
          rustc --version
          printf 'Base RUSTFLAGS: %s\n' "$RUSTFLAGS"
      - name: Install linker prerequisites
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Report sccache wiring
        # See `build-test`: the action installs sccache but sets no wrapper, so
        # this step is the evidence that the job's compilation is wrapped.
        run: |
          set -euo pipefail
          wrapper="${RUSTC_WRAPPER:?DL-03 requires a compiler wrapper}"
          command -v "$wrapper"
          sccache --show-stats
      - name: Install the build standard
        # The pinned toolchain and mold must precede every local suite route.
        run: make install-build-tools
      - name: Install test runner
        env:
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm --locked cargo-nextest
      - name: Test
        # `make test` runs `make act-validation` only under `WITH_ACT=1`; the
        # hosted lane must never recurse into Act.
        env:
          WITH_ACT: '0'
        run: make test
      - name: Test the single-feature isolation profiles
        # `make test` above builds `polars-enabled`, which selects both
        # features. Neither required job builds a single-feature profile, so
        # the `macros_only` and `polars_only` modules in
        # `tests/build_profiles.rs` exist but never run. Their target runs
        # exactly one integration-test binary under each profile, which is why
        # it fits here rather than adding a fourth job: this job's own AC-07
        # measurement has the headroom, and a new job would restart the
        # registered 20-run window again.
        run: make test-profiles
