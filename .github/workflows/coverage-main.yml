name: Coverage (main)

# This workflow is the repository's only CodeScene caller. CodeScene
# accepts `cs-coverage upload` only for analysed branches, so main-branch
# coverage is uploaded here; pull requests generate coverage in ci.yml for
# their own ratchet and never receive the token or contact CodeScene. This
# workflow also advances the coverage ratchet baseline: caches saved on main
# are readable by every pull-request run, so the baseline written here is the
# one a pull request's ratchet compares against.
#
# workflow_dispatch is mandatory, not a convenience: merges performed by
# an external automerge workflow's GITHUB_TOKEN do not fire push-event workflows,
# so automerged changes to main only receive coverage when this workflow
# is dispatched from main. Before provisioning the token, restrict the
# declared `codescene` environment to main and store it as an environment secret.
# Repository files cannot create that remote protection or CodeScene project.

'on':
  push:
    branches: [main]
  workflow_dispatch:

# Publishers queue rather than race or cancel. Runs in the group never
# overlap, and a newer trigger replaces an older pending run; nothing here
# promises that runs start in commit order. The coverage action saves the
# ratchet baseline only on a push, so a dispatch uploads coverage but leaves
# the baseline where the last completed push left it.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # Pinned so results stay comparable between runs. The test deadline wrapper
    # that once needed GNU `timeout` is gone; nextest bounds the tests.
    runs-on: ubuntu-24.04
    # Restrict this environment to main before adding CS_ACCESS_TOKEN.
    # With no token configured, the conditional CodeScene upload skips.
    environment: codescene
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # DL-03: route every rustc invocation through the cache sccache-action
      # installed. The action installs the binary and exports `SCCACHE_PATH`
      # but never sets this variable, and Cargo silently ignores a wrapper it
      # cannot run, so the cache stayed unreachable until it was named here.
      RUSTC_WRAPPER: sccache
      # The GitHub Actions cache backend DL-03 names. Without it sccache
      # compiles through to disk and shares nothing with the pull-request lane,
      # which is the half of the clause that makes main's cache reachable there.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@47b337e4f230b591891656534d4ffad868131740
        with:
          rustflags: ''
          # DL-03 requires sccache in every hosted job; the action's default is
          # already `true`, so this pins the dependency rather than changing it.
          use-sccache: 'true'
      - name: Log Rust compiler configuration
        run: |-
          rustc --version
          printf 'Base RUSTFLAGS: %s\n' "$RUSTFLAGS"
      - name: Install linker prerequisites
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Report sccache wiring
        # See ci.yml's `build-test`. The cache this job writes is the one
        # pull-request runs restore, so this lane's wrapper is load-bearing for
        # the whole repository and not only for its own run.
        run: |
          set -euo pipefail
          wrapper="${RUSTC_WRAPPER:?DL-03 requires a compiler wrapper}"
          command -v "$wrapper"
          sccache --show-stats
      - name: Install the build standard
        # Coverage excludes mold, but its test suite reaches Make targets that check it.
        run: make install-build-tools
      - name: Install test runner
        env:
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm --locked cargo-nextest
      - name: Build the cardinality gate's test binary
        # The coverage run reaches tests/cardinality_probe_ui.rs, which only
        # reads and runs the binary this target records.
        run: make prepare-ui-gate
      - name: Log coverage linker configuration
        run: |
          echo "Coverage linker: clang"
          echo "Coverage RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld"
          echo "Coverage CFLAGS: -fuse-ld=lld"
          echo "Coverage LDFLAGS: -fuse-ld=lld"
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        env:
          CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -D warnings -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          # DL-03: coverage keeps measuring the native-only profile, so this
          # baseline uses the same features the pull-request lane measures.
          # An empty `features` list adds no `--features` flag, and
          # `--no-default-features` is what selects the profile.
          with-default-features: 'false'
          features: ''
      # Publishes whether the token exists, and nothing else. The token is in
      # no `env` on this workflow: the upload is a composite action whose
      # nested steps inherit the calling step's `env`. GitHub evaluates the
      # expression before it sends the command to the runner, so this shell
      # receives only `true` or `false`; the upload alone receives the token,
      # as its input.
      - name: Check CodeScene token availability
        id: codescene_token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # The ref guard is not redundant with the push branch filter: a
      # dispatch runs from whichever branch started it, and the upload action
      # does not check the ref itself.
      - name: Upload coverage data to CodeScene
        if: steps.codescene_token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        # No checksum input: the uploader pins cs-coverage through its own
        # manifest and rejects a non-empty `installer-checksum`.
        with:
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
