version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"

  # Enable version updates for Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    # Polars is pinned deliberately: AC-04's build budgets and task 1.2.6's
    # capability record are calibrated against 0.55.2, and the facade's feature
    # list is chosen for that release. A version bump is a scope decision for
    # those controls, not a dependency chore, so Dependabot must not open one.
    ignore:
      - dependency-name: "polars*"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"

  # The calibration probe, the consumer fixtures, and the compile-fail gate are
  # each their own workspace root with their own lockfile, so the root entry
  # above does not reach them.
  - package-ecosystem: "cargo"
    directories:
      - "/tools/calibration/cardinality-probe"
      - "/tools/fixtures/native-consumer"
      - "/tools/fixtures/polars-surface-absent"
      - "/tools/gates/cardinality-ui"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"

  # Keep the pinned nightly in rust-toolchain.toml current.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust-toolchain"
    schedule:
      interval: "daily"
